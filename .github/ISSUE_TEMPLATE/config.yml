# Device submissions arrive as a prefilled issue from `umbra contribute`, which
# links straight to issues/new with a body already written. That link only works
# while blank issues are allowed — turning them off sends it to the chooser
# instead and silently drops the body.
blank_issues_enabled: true

contact_links:
  - name: Contribute a monitor
    url: https://github.com/jesvijonathan/Display-Control/blob/master/devices/README.md
    about: Run `umbra contribute --open` and Umbra fills this in for you.
