name: Device library
# The whole life of the device library, in one place:
#  - check    every pull request and push that touches devices/ is validated
#             with the same rules DispCtrl loads a definition with;
#  - index    after a merge, CATALOG.md and index.json are regenerated (never in
#             the pull request: every share would then conflict with the last);
#  - intake   a share made with `dispctrl devices contribute` or the app's Devices
#             page arrives as an issue, and becomes a pull request for review;
#             a weekly sweep takes in any the issue event missed.
#  - guard    a pull request may add to the library; changing what was already
#             reviewed fails unless the repository's own people made it.
# Linux runners: the checks need no Windows API, and they start faster.
on:
  pull_request:
    paths: ['devices/**', 'src/DispCtrl.Core/Devices/**', 'tools/devicecheck/**']
  push:
    branches: [main, master]
    paths: ['devices/**', 'src/DispCtrl.Core/Devices/**', 'tools/devicecheck/**']
  issues:
    types: [opened, edited]
  # "/intake" from a maintainer takes a share in whatever the filters said.
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 4 * * 1'   # Mondays, 04:23 UTC: every open share not yet taken in
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [validate, rebuild the index, intake an issue, intake every open share, self-test]
        default: validate
      issue:
        description: Issue number, for "intake an issue"
        required: false
permissions: {}
concurrency:
  group: devices-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
env:
  DEVICECHECK: dotnet run --project tools/devicecheck -c Release --property:EnableWindowsTargeting=true --
# Named, not left to the default: only an explicit bash runs with pipefail, and
# without it "validate | tee" reported success while devicecheck failed to start.
defaults:
  run:
    shell: bash
jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'validate' || inputs.action == 'self-test' || inputs.action == 'rebuild the index'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent
          # is the base the guard compares against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate the library
        run: $DEVICECHECK validate devices | tee validate.log
      - name: Self-test the intake
        run: $DEVICECHECK selftest
      - name: Guard what was already reviewed
        if: github.event_name == 'pull_request'
        env:
          # The repository's own people may correct reviewed data; nobody else.
          TRUSTED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          # From outside, a pull request that reaches the library may hold
          # model data and nothing else: no tool, no workflow, no deletion.
          if [ "$TRUSTED" != "true" ]; then
            outside=$(git diff --name-status HEAD^1 HEAD \
              | grep -vE '^[AM]\s+devices/[A-Z]{3}/[0-9A-F]{4}/(record\.md|definition\.json|reports\.json)$' || true)
            if [ -n "$outside" ]; then
              echo "::error::A pull request from outside the repository that touches the device library may only add or extend model data files:"
              echo "$outside"
              exit 1
            fi
          fi
          # The base branch's copy of the tool: a pull request cannot loosen
          # the rules it is judged by.
          set +e
          dotnet run --project "$RUNNER_TEMP/base/tools/devicecheck" -c Release --property:EnableWindowsTargeting=true -- \
            guard "$RUNNER_TEMP/base/devices" devices > guard.log 2>&1
          found=$?
          set -e
          cat guard.log
          {
            echo "### Changes to reviewed data"
            echo
            echo '```'
            cat guard.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$found" -ne 0 ]; then
            if [ "$TRUSTED" = "true" ]; then
              echo "::warning::This pull request changes data that was already reviewed ($found change(s)); see the summary."
            else
              echo "::error::A pull request from outside the repository may add to the library, not change what was reviewed ($found change(s))."
              exit 1
            fi
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "## Device library: ${{ job.status }}"
            echo
            echo '```'
            tail -n 40 validate.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'rebuild the index')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The index dates each model from the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Regenerate index.json and CATALOG.md
        run: $DEVICECHECK index devices
      - name: Commit them if they changed
        run: |
          git add devices/index.json devices/CATALOG.md
          if git diff --cached --quiet; then
            echo "Index already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'dispctrl-index'
          git config user.email 'dispctrl-index@users.noreply.github.com'
          git commit -m "Regenerate the device index"
          git push
          echo "Index regenerated and pushed: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  shares:
    # Recognised by the payload, not a label: GitHub drops the labels a
    # prefilled link asks for when the author cannot triage. "Every open share"
    # is each open issue carrying one, less those with a pull request open
    # already; an issue closed after its merge is not taken in twice.
    # Automatic runs skip bots, accounts under two weeks old and anyone with
    # more than three shares open; naming an issue by hand takes it regardless.
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, 'dispctrl-device-mapping')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/intake') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'intake an issue' || inputs.action == 'intake every open share'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    outputs:
      issues: ${{ steps.find.outputs.issues }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_ISSUE: ${{ github.event.issue.number }}
      EVENT_AUTHOR: ${{ github.event.issue.user.login }}
      INPUT_ISSUE: ${{ inputs.issue }}
      ACTION: ${{ inputs.action }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Find the shares
        id: find
        run: |
          # Why an issue was passed over goes to the summary; the event's own
          # issue is also told, once, so a real owner knows it is not lost.
          eligible() {
            read -r type created < <(gh api "users/$1" --jq '"\(.type) \(.created_at)"') || return 1
            age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
            shares=$(gh issue list --repo "$GITHUB_REPOSITORY" --author "$1" --state open --limit 100 --json body \
              --jq '[.[] | select((.body // "") | contains("dispctrl-device-mapping"))] | length')
            why=""
            if [ "$type" != "User" ]; then why="the author is not a person"
            elif [ "$age" -lt 14 ]; then why="the account is $age day(s) old"
            elif [ "$shares" -gt 3 ]; then why="the author has $shares shares open"
            fi
            if [ -z "$why" ]; then return 0; fi
            echo "- #$2 passed over: $why" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }
          if [ -n "$COMMENT_ID" ]; then
            # A maintainer's /intake: acknowledged with a reaction, no filters.
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null || true
            list="[$EVENT_ISSUE]"
          elif [ "$ACTION" = "intake an issue" ]; then
            case "$INPUT_ISSUE" in ''|*[!0-9]*) echo "An issue number is needed." >&2; exit 1 ;; esac
            list="[$INPUT_ISSUE]"
          elif [ -n "$EVENT_ISSUE" ]; then
            if eligible "$EVENT_AUTHOR" "$EVENT_ISSUE"; then list="[$EVENT_ISSUE]"; else
              list="[]"
              gh issue comment "$EVENT_ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "Thanks for contributing your monitor. This one waits for a maintainer to take it in, which happens for new accounts; nothing more is needed from you. (Maintainers: comment /intake to take it in.)"
            fi
          else
            pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json headRefName \
              --jq '[.[].headRefName | select(test("^device-share/[0-9]+$")) | ltrimstr("device-share/") | tonumber]')
            list="["
            while read -r number login; do
              if [ -n "$number" ] && eligible "$login" "$number"; then list="$list$number,"; fi
            done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,body,author \
              --jq ".[] | select((.body // \"\") | contains(\"dispctrl-device-mapping\")) | select(([.number] - $pending) | length > 0) | \"\\(.number) \\(.author.login)\"")
            list="${list%,}]"
          fi
          echo "issues=$list" >> "$GITHUB_OUTPUT"
          echo "Shares to take in: $list" >> "$GITHUB_STEP_SUMMARY"
  intake:
    needs: shares
    if: needs.shares.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # One at a time: each share is committed to the default branch, and the
      # next one starts from that commit rather than racing it.
      max-parallel: 1
      matrix:
        issue: ${{ fromJSON(needs.shares.outputs.issues) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ matrix.issue }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as it is now, not as it was when the run started: the
          # share before this one may have just been committed to it. Full
          # history, as the index it regenerates dates each model by its commit.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Turn the issue into files
        id: intake
        run: |
          if [ -z "$ISSUE" ]; then echo "No issue number." >&2; exit 1; fi
          # What the library held before this share, for the guard below.
          cp -r devices "$RUNNER_TEMP/before"
          # Untrusted text: fetched to a file, never interpolated into a script.
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          set +e
          # The issue number is recorded against the model; the author is not.
          # Commits and pull requests carry the number too, never a name.
          $DEVICECHECK intake "$RUNNER_TEMP/issue.md" devices --issue "$ISSUE" > "$RUNNER_TEMP/intake.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/intake.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Check the result is only data, and only additions
        id: gate
        if: steps.intake.outputs.code == '0'
        run: |
          # Every path the intake touched must be one model's data file, added
          # or extended. Anything else - a deletion, a file outside a model
          # folder, a name the layout does not have - stops the run here.
          outside=$(git status --porcelain --untracked-files=all \
            | grep -vE '^( M|\?\?) devices/[A-Z]{3}/[0-9A-F]{4}/(record\.md|definition\.json|reports\.json)$' || true)
          if [ -n "$outside" ]; then
            echo "::error::The intake touched something other than a model's data files:"
            echo "$outside"
            exit 1
          fi
          $DEVICECHECK validate devices > "$RUNNER_TEMP/validate.log" || { cat "$RUNNER_TEMP/validate.log"; exit 1; }
          $DEVICECHECK guard "$RUNNER_TEMP/before" devices > "$RUNNER_TEMP/guard.log" || { cat "$RUNNER_TEMP/guard.log"; echo "::error::The intake changed reviewed data."; exit 1; }
          # A share that disagrees with the library, or asks for a code to be
          # written, waits for a person; everything else goes straight in.
          if grep -q '^review: ' "$RUNNER_TEMP/intake.log"; then echo "merge=review" >> "$GITHUB_OUTPUT"; else echo "merge=auto" >> "$GITHUB_OUTPUT"; fi
      - name: Commit it to the library
        id: commit
        if: steps.gate.outputs.merge == 'auto'
        run: |
          git config user.name 'dispctrl-intake'
          git config user.email 'dispctrl-intake@users.noreply.github.com'
          git add devices
          git commit -q -m "Device share from #$ISSUE"
          # Something else may have landed meanwhile. A clean rebase only
          # replays these additions; a conflict (two shares of one model at
          # once) gives up rather than choose, and the weekly run retries.
          for attempt in 1 2 3; do
            git push -q origin "HEAD:$BASE" && break
            if [ "$attempt" = 3 ]; then echo "::error::Could not push after three attempts; the weekly run will try again."; exit 1; fi
            git fetch -q origin "$BASE"
            git rebase -q "origin/$BASE" || { git rebase --abort; echo "::error::The share conflicts with a change made meanwhile; the weekly run will try again."; exit 1; }
          done
          sha=$(git rev-parse HEAD)
          # A push made with this token starts no workflow, so the index job
          # never sees it: the index is regenerated here, from the branch as
          # it now stands.
          for attempt in 1 2 3; do
            git fetch -q origin "$BASE" && git reset -q --hard "origin/$BASE"
            $DEVICECHECK index devices > /dev/null
            git add devices/index.json devices/CATALOG.md
            git diff --cached --quiet && break
            git commit -q -m "Regenerate the device index"
            git push -q origin "HEAD:$BASE" && break
          done
          # An earlier run may have left a branch and a pull request for this
          # share; deleting the branch closes the pull request.
          git push -q origin --delete "device-share/$ISSUE" 2>/dev/null || true
          gh issue comment "$ISSUE" --body "Thanks - this share is now in the device library: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha"
          gh issue close "$ISSUE" --reason completed
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha" >> "$GITHUB_OUTPUT"
      - name: Open a pull request for review
        id: pr
        if: steps.gate.outputs.merge == 'review'
        run: |
          branch="device-share/$ISSUE"
          git config user.name 'dispctrl-intake'
          git config user.email 'dispctrl-intake@users.noreply.github.com'
          git checkout -B "$branch"
          git add devices
          git commit -m "Device share from #$ISSUE"
          git push --force origin "$branch"
          url=$(gh pr list --head "$branch" --json url --jq '.[0].url')
          {
            echo "Generated from #$ISSUE by the Device library workflow. It only adds: new models, new codes and the report number; nothing already in the library is changed, and every code arrives read-only."
            echo
            echo "It was not merged automatically because:"
            echo
            sed -n 's/^review: /- /p' "$RUNNER_TEMP/intake.log"
            echo
            echo "Merge it as it is, or edit it first (for example to set \"writable\": true). The branch is deleted when it is merged or closed."
            echo
            # Merging closes the issue; the intake closes it itself for a share it commits.
            echo "Closes #$ISSUE"
          } > "$RUNNER_TEMP/pr-body.md"
          if [ -z "$url" ] && ! url=$(gh pr create --head "$branch" --base "$BASE" --title "Device share from #$ISSUE" --body-file "$RUNNER_TEMP/pr-body.md"); then
            # Refused while the repository does not let Actions open pull
            # requests. The branch is pushed, so opening it is one click.
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
            echo "::warning::Actions may not open pull requests in this repository (Settings > Actions > General > Workflow permissions). Open it from $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue comment "$ISSUE" --body "Thanks - this share needs a maintainer's look before it goes in: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Close a share already taken in
        if: steps.intake.outputs.code == '4'
        run: |
          # Exit 4: every model in it already carries this issue's number.
          gh issue comment "$ISSUE" --body "Everything in this share is already in the device library. Thanks!"
          gh issue close "$ISSUE" --reason completed
      - name: Explain a share that could not be read
        if: steps.intake.outputs.code != '0' && steps.intake.outputs.code != '3' && steps.intake.outputs.code != '4'
        run: |
          {
            echo "The intake could not read this share:"
            echo
            echo '```'
            sed 's/```/'"'''"'/g' "$RUNNER_TEMP/intake.log"
            echo '```'
            echo
            echo "Edit the JSON block and the intake runs again."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
      - name: Summary
        if: always()
        run: |
          case "${{ steps.intake.outputs.code }}/${{ steps.gate.outputs.merge }}" in
            0/auto) result="committed to the library: ${{ steps.commit.outputs.url }}" ;;
            0/review) result="pull request for review: ${{ steps.pr.outputs.url }}" ;;
            0/*) result="stopped by the gate; see the log" ;;
            3/*) result="not a device share; nothing to do" ;;
            4/*) result="already in the library; issue closed" ;;
            *) result="could not be read; the issue has a comment explaining why" ;;
          esac
          echo "## Device share intake: issue #$ISSUE - $result" >> "$GITHUB_STEP_SUMMARY"
