name: Distribute
# Sends a published stable release to winget and the Microsoft Store. Runs when
# you publish a release, or from Actions > Distribute > Run workflow. Beta
# releases never leave GitHub. Each target does nothing until its repository
# variable is set, so this workflow is inert on a fork.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to distribute, such as v0.1.0
        required: true
      targets:
        description: Where to send it
        type: choice
        options: [both, winget, microsoft store]
        default: both
      dry_run:
        description: Check everything but submit nothing
        type: boolean
        default: false
permissions: {}
concurrency:
  group: distribute-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  TARGETS: ${{ inputs.targets || 'both' }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
jobs:
  winget:
    # The first version is submitted by hand (wingetcreate new); after that
    # each release is an update to the manifest already in winget-pkgs.
    if: vars.WINGET_PACKAGE_ID != '' && (inputs.targets == '' || inputs.targets == 'both' || inputs.targets == 'winget' || github.event_name == 'release')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions: {}
    env:
      PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
      # A classic token with public_repo scope: wingetcreate forks
      # microsoft/winget-pkgs under that account and opens the pull request.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit the update to winget-pkgs
        id: submit
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { throw 'Set the WINGET_TOKEN secret.' }
          $version = $env:TAG -replace '^v',''
          if ($version -match '-') { throw "$env:TAG is a prerelease; winget carries stable releases only." }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/DispCtrl-$version-stable-win-x64-setup.exe"
          $response = Invoke-WebRequest -Uri $url -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -ge 400) { throw "The installer is not public at $url (HTTP $($response.StatusCode))." }
          "installer=$url" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:DRY_RUN -eq 'true') { 'Dry run: nothing submitted.'; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update $env:PACKAGE_ID --version $version --urls "$url|x64" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'wingetcreate failed.' }
      - name: Summary
        if: always()
        shell: pwsh
        env:
          STATUS: ${{ job.status }}
          INSTALLER: ${{ steps.submit.outputs.installer }}
        run: |
          $mode = if ($env:DRY_RUN -eq 'true') { ' (dry run)' } else { '' }
          @("## winget: $env:STATUS$mode", '', "Package ``$env:PACKAGE_ID`` $env:TAG",
            "Installer: $env:INSTALLER",
            "Pull requests: https://github.com/microsoft/winget-pkgs/pulls?q=$env:PACKAGE_ID") -join "`n" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  store:
    if: vars.STORE_PRODUCT_ID != '' && (inputs.targets == '' || inputs.targets == 'both' || inputs.targets == 'microsoft store' || github.event_name == 'release')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Configure required reviewers on this environment: a Store submission
    # cannot be recalled once certification starts.
    environment: microsoft-store
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # For the Store identity in build/packaging/AppxManifest.xml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the MSIX from the release
        id: msix
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ vars.STORE_IDENTITY }}
        run: |
          if ($env:TAG -match '-') { throw "$env:TAG is a prerelease; only stable releases go to the Store." }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*.msix' --dir msix
          if ($LASTEXITCODE -ne 0) { throw 'The release has no MSIX.' }
          $package = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          # Refuse a package built with another identity: Partner Center would
          # reject it, but only after the submission is created.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
            $manifest = [xml]$reader.ReadToEnd(); $reader.Dispose()
          } finally { $zip.Dispose() }
          $name = $manifest.Package.Identity.Name
          $expected = if ($env:STORE_IDENTITY) { $env:STORE_IDENTITY } else { ([xml](Get-Content build/packaging/AppxManifest.xml -Raw)).Package.Identity.Name }
          if ($name -ne $expected) { throw "The MSIX identity is '$name', not the Store's '$expected'." }
          "path=$($package.FullName)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($package.Name)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        if: env.DRY_RUN != 'true'
      - name: Submit to Partner Center
        if: env.DRY_RUN != 'true'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          MSIX: ${{ steps.msix.outputs.path }}
        run: |
          foreach ($name in 'TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Set the PARTNER_CENTER_$name secret." }
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Partner Center sign-in failed.' }
          msstore publish (Split-Path $env:MSIX) --inputFile $env:MSIX --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Store submission failed.' }
      - name: Summary
        if: always()
        shell: pwsh
        env:
          STATUS: ${{ job.status }}
          PACKAGE: ${{ steps.msix.outputs.name }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $mode = if ($env:DRY_RUN -eq 'true') { ' (dry run: checked, not submitted)' } else { '' }
          @("## Microsoft Store: $env:STATUS$mode", '', "Package: $env:PACKAGE ($env:TAG)",
            "Partner Center: https://partner.microsoft.com/dashboard/products/$env:PRODUCT_ID/overview",
            "Store page: https://apps.microsoft.com/detail/$env:PRODUCT_ID") -join "`n" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
